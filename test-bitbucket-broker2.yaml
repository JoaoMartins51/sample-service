apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: bitbucket-server-test-template
  title: Test Bitbucket Server Publish
  description: A simple template to test publishing to Bitbucket Server
  tags:
    - test
    - bitbucket-server
spec:
  owner: test-team
  type: service

  parameters:
    - title: Repository Details
      required:
        - repoUrl
        - name
      properties:
        name:
          title: Name
          type: string
          description: Name of the component
        description:
          title: Description
          type: string
          description: Description of the repository
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}

    - id: publish-bitbucket-server
      name: Publish to Bitbucket Server
      action: publish:bitbucketServer
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private

  output:
    links:
      - title: Repository
        url: ${{ steps['publish-bitbucket-server'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['publish-bitbucket-server'].output.entityRef }}
