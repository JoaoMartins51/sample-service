# Template to reproduce the ROADIE_BROKER bug
# This will fail with: "TypeError: Failed to parse URL from ${ROADIE_BROKER}/..."
# when the Bitbucket Server integration uses a brokered connection
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: test-bitbucket-server-pr
  title: Test Bitbucket Server PR (Brokered)
  description: Template to test Bitbucket Server PR action with brokered connection
spec:
  owner: team-a
  type: service
  parameters:
    - title: Repository Info
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository URL
          type: string
          default: 'bitbucketServer?host=broker://my-bitbucket-token&project=ENG_KMS_INFRASTRUCTURE&repo=bode_config'
          description: The Bitbucket Server repository
        targetBranch:
          title: Target Branch
          type: string
          default: 'integration'
          description: Branch to create PR against
  steps:
    - id: debug-start
      name: Debug - Starting
      action: debug:log
      input:
        message: 'Testing Bitbucket Server PR with brokered connection'
    - id: create-pr
      name: Create Pull Request
      action: publish:bitbucketServer:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        title: 'Test PR from Backstage'
        description: 'This is a test PR'
        sourceBranch: 'main'
        targetBranch: ${{ parameters.targetBranch }}
