---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: test-publish-bitbucket-server-pull-request
  title: Test Publish Bitbucket Server Pull Request
  description: Test template for the publish:bitbucketServer:pullRequest scaffolder action
  tags:
    - test
    - bitbucket
    - bitbucket-server
    - pull-request
spec:
  owner: team-a
  type: service

  parameters:
    - title: Pull Request Information
      required:
        - repoUrl
        - title
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - bitbucket.example.com
        title:
          title: PR Title
          type: string
          description: Title for the pull request
        description:
          title: PR Description
          type: string
          description: Description for the pull request
        sourceBranch:
          title: Source Branch
          type: string
          description: The branch containing the changes
          default: feature-branch
        targetBranch:
          title: Target Branch
          type: string
          description: The branch to merge into
          default: main

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: test-pr

    - id: publish-pr
      name: Create Pull Request to Bitbucket Server
      action: publish:bitbucketServer:pullRequest
      input:
        repoUrl: ${{ parameters.repoUrl }}
        title: ${{ parameters.title }}
        description: ${{ parameters.description }}
        sourceBranch: ${{ parameters.sourceBranch }}
        targetBranch: ${{ parameters.targetBranch }}

  output:
    links:
      - title: Pull Request
        url: ${{ steps['publish-pr'].output.pullRequestUrl }}

