# Test Scaffolder Templates for Bitbucket Publish Actions
# These templates are for testing the publish:bitbucketServer and publish:bitbucketCloud actions

---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: test-publish-bitbucket-server
  title: Test Publish to Bitbucket Server
  description: Test template for the publish:bitbucketServer scaffolder action
  tags:
    - test
    - bitbucket
    - bitbucket-server
spec:
  owner: team-a
  type: service

  parameters:
    - title: Repository Information
      required:
        - name
        - repoUrl
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Description of the component
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - bitbucket.example.com
            allowedProjects:
              - MY_PROJECT
        defaultBranch:
          title: Default Branch
          type: string
          description: The default branch for the repository
          default: main
        repoVisibility:
          title: Repository Visibility
          type: string
          description: The visibility of the repository
          default: private
          enum:
            - private
            - public

    - title: Git Configuration
      properties:
        gitCommitMessage:
          title: Initial Commit Message
          type: string
          description: The commit message for the initial commit
          default: 'Initial commit from scaffolder'
        gitAuthorName:
          title: Git Author Name
          type: string
          description: The author name for the initial commit
        gitAuthorEmail:
          title: Git Author Email
          type: string
          description: The author email for the initial commit

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish to Bitbucket Server
      action: publish:bitbucketServer
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: ${{ parameters.defaultBranch }}
        repoVisibility: ${{ parameters.repoVisibility }}
        gitCommitMessage: ${{ parameters.gitCommitMessage }}
        gitAuthorName: ${{ parameters.gitAuthorName }}
        gitAuthorEmail: ${{ parameters.gitAuthorEmail }}

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}

